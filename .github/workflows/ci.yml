name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Repo structural checks
        run: python3 tools/check_skill.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate the real example evidence.json
        run: |
          python3 scripts/validate_evidence.py \
            examples/public-industry-case/evidence.json \
            --report examples/public-industry-case/report.md

      - name: Build release package
        run: python3 tools/build_release.py --out-dir dist

      - name: Upload release artifacts (Linux/py3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: industry-research-release
          path: dist/
